services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library_api
    environment:
      DATABASE_URL: postgresql+psycopg2://library:library@library_db:5432/library
    ports:
      - "8000:8000"
    networks:
      - bibliotech_squelette_default

networks:
  bibliotech_squelette_default:
    external: true